<style>:root{--navy:#0a1240;--blue:#1a35ff;--sky:#0b6bff;--green:#10e5a0;--bg:#f2f5fb;--tx:#0f1b3d;--mut:#64748b;--ln:#e3e9f4}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column}main{flex:1}
header{position:sticky;top:0;z-index:5;background:#fffffff2;backdrop-filter:blur(8px);border-bottom:1px solid var(--ln);box-shadow:0 2px 14px #0a124012}
.hd{max-width:980px;margin:auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.hd img{height:46px}.hd span{font-weight:700;color:var(--blue);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.wrap{max-width:980px;margin:auto;padding:0 20px}.pad{padding:26px 20px 40px}
.hero{background:radial-gradient(800px 380px at 90% -10%,#10e5a066,transparent),linear-gradient(135deg,var(--navy),#10248f 55%,var(--sky));color:#fff;padding:56px 0 110px}
.hero h1{font-size:clamp(30px,6vw,46px);line-height:1.1;margin:0 0 12px;font-weight:800}.hero p{margin:0;max-width:520px;opacity:.85;font-size:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:-70px;padding-bottom:40px}
.rc{background:#fff;border-radius:22px;padding:26px;cursor:pointer;box-shadow:0 12px 34px #0a124022;transition:.25s;border:1px solid var(--ln)}.rc:hover{transform:translateY(-6px);box-shadow:0 20px 44px #1a35ff30}
.rc h3{margin:14px 0 6px;font-size:21px}.rc p{margin:0 0 14px;color:var(--mut);font-size:14px}.rc b{color:var(--blue)}
.ic{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--green));display:grid;place-items:center;color:#fff}.ic svg{width:28px;height:28px}
.pn{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 6px 24px #0a124010;animation:up .35s ease}@keyframes up{from{opacity:0;transform:translateY(12px)}}
h2{margin:0 0 4px;font-size:22px}h3{margin:0 0 10px;font-size:17px}.mut,small{color:var(--mut)}
label{display:block;margin:12px 0 6px;font-weight:600;font-size:13px;color:#334155}
input,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--ln);border-radius:12px;font:inherit;background:#f8faff;transition:.2s}input:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px #1a35ff1f;background:#fff}
.b,.btn{border:0;padding:13px 22px;border-radius:12px;font:inherit;font-weight:700;color:#fff;cursor:pointer;text-decoration:none;display:inline-block;margin:6px 8px 0 0;background:linear-gradient(135deg,var(--blue),var(--sky));box-shadow:0 6px 16px #1a35ff3a;transition:.2s}.b:hover,.btn:hover{transform:translateY(-2px)}
.ok{background:linear-gradient(135deg,#0aa86b,#10e5a0);box-shadow:0 6px 16px #10e5a03a}.no{background:linear-gradient(135deg,#c81e1e,#ef4444);box-shadow:0 6px 16px #dc262633}.sec{background:#e8edf7;color:var(--tx);box-shadow:none}
.btn{display:block;text-align:center;margin:10px 0;background:linear-gradient(135deg,#128c4a,#25d366);box-shadow:0 6px 16px #25d36644}
.row{display:flex;gap:8px;margin-bottom:8px}.row input:last-child{max-width:100px}.tag{display:inline-block;color:#fff;padding:4px 13px;border-radius:99px;font-size:12px;font-weight:700}
.lock{max-width:380px;margin:40px auto;text-align:center}.lock .ic{margin:0 auto 14px}.lock input{text-align:center;font-size:22px;letter-spacing:8px}.er{color:#dc2626;min-height:22px;margin:6px 0;font-weight:600}
.it2{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--ln)}.it2 span{flex:1}.it2 input{max-width:130px}.tot{font-size:20px;font-weight:800;text-align:right;margin:12px 0;color:var(--blue)}
.steps{display:flex;margin:20px 0 8px}.s{flex:1;text-align:center;position:relative;font-size:11px;color:var(--mut)}.s i{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 6px;border-radius:50%;background:#e8edf7;font-style:normal;font-weight:700;position:relative;z-index:1}
.s:not(:first-child)::before{content:"";position:absolute;top:14px;left:-50%;width:100%;height:3px;background:#e8edf7}.s.done i,.s.now i{background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff}.s.done::before,.s.now::before{background:var(--blue)}.s.now i{box-shadow:0 0 0 5px #1a35ff25}.s.done,.s.now{color:var(--tx);font-weight:600}.bad .s.now i{background:#dc2626;box-shadow:0 0 0 5px #dc262625}
.ln{padding:6px 0;border-bottom:1px solid var(--ln)}footer{text-align:center;padding:22px;color:var(--mut);font-size:13px}footer b{color:var(--blue)}.top{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.it2{flex-wrap:wrap}.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:0;width:100%;color:#0a8f5a}.chk input{width:20px;height:20px;padding:0;accent-color:#0aa86b}.est{color:#0a8f5a;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.cards2{margin-top:-70px;padding-bottom:30px}.tile{background:#f8faff;border:1.5px solid var(--ln);border-radius:14px;padding:14px 8px;text-align:center;font-weight:600;font-size:14px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:6px;align-items:center}.tile:hover{border-color:var(--blue);transform:translateY(-3px);box-shadow:0 8px 20px #1a35ff22}.tile span{font-size:26px}

 if(i>=0)for(let j=i+1;j<L.length&&/^\s*[-•]/.test(L[j]);j++)it.push(L[j].replace(/^\s*[-•]\s*/,'').trim());

 const s=g('Status');return{hist:hs,retirante:g('Retirado por'),retiradoEm:g('Retirada em'),problema:g('Problema'),solucao:g('Solução'),protocolo:g('Protocolo'),nome:g('Solicitante'),telefone:dig(g('Telefone')),setor:g('Setor'),uso:g('Uso')=='Cliente'?'Cliente':'Empresa',cliente:g('Cliente'),urgente:/urgente/i.test(g('Prioridade')),nota:g('Observação'),itens:it,status:ST.find(x=>s.startsWith(x))||s,total:g('Total').replace(/^R\$\s*/,''),prazo:g('Prazo'),obs:g('Observações'),motivo:g('Motivo'),pedido:g('Pedido'),fornecedor:g('Fornecedor'),previsao:g('Previsão')}}
function msg(d,st,t,by,to){const E=d.itens.filter(isEst).length,L=[`*${t}*`,'Enviado por: '+by,'Protocolo: '+d.protocolo,'Solicitante: '+d.nome,'Telefone: '+d.telefone,'Setor: '+d.setor,'Uso: '+d.uso,'Tipo de solicitação: '+(d.tipoSolicitacao||d.uso)];

 if(r=='A'&&k==2)f=(allEst(d)?'<p class=est>✅ Todos os itens já possuem em estoque — não há necessidade de comprar.</p>':d.itens.some(isEst)?'<p class=est>✅ Itens em estoque sinalizados: compras comprará apenas o restante.</p>':'')+(cli?`<button class="b ok" onclick=gerarAquisicao_()>CLIENTE APROVOU — GERAR AQUISIÇÃO</button>`:`<button class="b ok" onclick=proxAlm()>${allEst(d)?'PRODUTO DISPONÍVEL — AVISAR SOLICITANTE':'ENVIAR PARA COMPRAS'}</button>`);
 if(r=='C'&&k==3)f=pf(d);
 if(r=='A'&&k==3)f='<p>Aguardando o setor de Compras.</p>';
 if(r=='A'&&k==4)f=`<p><small>Já pode imprimir o termo e deixar separado junto ao material, antes da chegada.</small></p><button class=b onclick=termo()>🖨️ Imprimir termo de retirada</button><hr style="border:0;border-top:1px solid var(--ln);margin:14px 0"><h3>O material chegou?</h3><button class="b ok" onclick=chegou()>PRODUTO CHEGOU — AVISAR SOLICITANTE E COMPRAS</button><hr style="border:0;border-top:1px solid var(--ln);margin:14px 0"><h3>Algum problema com o pedido?</h3><label>Tipo de problema</label><select id=pt><option>Chegou incompleto (parcial)<option>Item errado<option>Material avariado<option>Atraso na entrega<option>Outro</select><label>Descrição</label><textarea id=pd rows=3></textarea><button class="b no" onclick=problema()>REGISTRAR PROBLEMA E AVISAR COMPRAS</button>`;
 if(r=='C'&&k==8)f=`<h3>Problema relatado pelo almoxarifado</h3><p class=rec>${esc(d.problema)}</p><label>Solução / posição de compras</label><textarea id=sl rows=3></textarea><label>Nova previsão de entrega (opcional)</label><input id=np placeholder="dd/mm/aaaa"><button class="b ok" onclick=resolver()>INFORMAR SOLUÇÃO</button>`;
 if(r=='A'&&k==8)f='<p>Aguardando o setor de Compras responder ao problema.</p>';
 if(r=='A'&&k==5)f=`<h3>Registrar retirada</h3><label>Nome de quem retirou o material</label><input id=rt placeholder="Nome completo"><button class="b ok" onclick=retirar()>CONFIRMAR RETIRADA E AVISAR SOLICITANTE</button><hr style="border:0;border-top:1px solid var(--ln);margin:14px 0"><button class=b onclick=termo()>🖨️ Reimprimir termo de retirada</button>`;
 const cur=[1,2,3,3,4,6,2,3,4,7][k]??1,L=['Solicitação','Cotação','Aprovação','Compras','Pedido','Disponível','Retirado'];
 $('#res').innerHTML=`<div class=pn><div class=top><h2 style="flex:1;font-size:17px;word-break:break-all">${esc(d.protocolo)}</h2><span class=tag style="background:${COR[k]||'#64748b'}">${esc(s)}</span></div>
 <div class="steps ${[6,7,8].includes(k)?'bad':''}">${L.map((l,i)=>`<div class="s ${i<cur?'done':i==cur?'now':''}"><i>${i<cur?'✓':i+1}</i>${l}</div>`).join('')}</div>
 <div class=ln><b>Solicitante:</b> ${esc(d.nome)} (+${esc(d.telefone)}) • ${esc(d.setor)} • Uso para ${cli?'cliente':'empresa'}${d.urgente?' • <span class=rec>🚨 URGENTE</span>':''}</div>${d.cliente?`<div class=ln><b>Cliente:</b> ${esc(d.cliente)}</div>`:''}${d.nota?`<div class=ln><b>Obs.:</b> ${esc(d.nota)}</div>`:''}${d.itens.map(i=>`<div class=ln>• ${itemH(i)}</div>`).join('')}${d.total?`<div class=ln><b>Total:</b> R$ ${esc(d.total)}</div>`:''}${d.prazo?`<div class=ln><b>Prazo:</b> ${esc(d.prazo)}</div>`:''}${d.pedido?`<div class=ln><b>Pedido:</b> ${esc(d.pedido)} • ${esc(d.fornecedor)} • ${esc(d.previsao)}</div>`:''}${d.motivo?`<div class=ln><b>Motivo:</b> ${esc(d.motivo)}</div>`:''}${d.retirante?`<div class=ln><b>Retirado por:</b> <span class=est>${esc(d.retirante)}</span>${d.retiradoEm?' em '+esc(d.retiradoEm):''}</div>`:''}${d.problema?`<div class=ln><b>Problema:</b> <span class=rec>${esc(d.problema)}</span></div>`:''}${d.solucao?`<div class=ln><b>Solução:</b> ${esc(d.solucao)}</div>`:''}${d.hist.length?'<div class=ln><b>Histórico</b></div>'+d.hist.map(h=>`<div class=ln style="font-size:13px">» ${esc(h)}</div>`).join(''):''}</div>
 <div class=pn>${f||`<p>${r=='X'?'Último andamento registrado. Para garantir que está atualizado, cole a mensagem mais recente em "Consultar protocolo".':(INFO[k]||'Esta mensagem não precisa de ação sua agora.')} <small>(Status: ${esc(s)})</small></p>`}</div>`;$('#res').scrollIntoView({behavior:'smooth'})}

/* ---- ações ---- */
function lines(req){const us=[...document.querySelectorAll('.u')],cs=[...document.querySelectorAll('.ck')];let t=0,all=true;
 const L=D.itens.map((it,i)=>{const b=base(it),u=+us[i].value;if(req&&!(u>0))throw new Error('Informe o valor unitário de todos os itens');if(u>0)t+=u*b.q;else all=false;return `${b.q}x ${b.n}${u>0?' — R$ '+R(u)+' un.':''}${cs[i].checked?' [EM ESTOQUE]':''}`});return{L,t:all&&t?R(t):''}}
function tot(){let t=0;document.querySelectorAll('.u').forEach((e,i)=>{t+=(+e.value||0)*base(D.itens[i]).q});$('#tt').textContent='Total: R$ '+R(t)}
function cotar(){try{const x=lines(1);D.itens=x.L;D.total=x.t;D.prazo=v('c2');D.obs=v('c3');send([['V','ORÇAMENTO DISPONÍVEL']],ST[1],'Almoxarifado')}catch(e){alert(e.message)}}
function estEmp(){const x=lines(0);D.itens=x.L;D.total=x.t;D.prazo=v('c2');D.obs=v('c3');proxAlm()}
function gerarAquisicao_(){operacaoPost_('criarAquisicao',{protocolo:D.protocolo},'A').then(x=>{if(x.erro)return alert(x.erro);D.aquisicaoGerada=true;alert('Aquisição vinculada ao orçamento. Os itens necessários foram encaminhados para Compras.');send([['C','AQUISIÇÃO GERADA A PARTIR DO ORÇAMENTO APROVADO']],ST[3],'Almoxarifado','Aquisição criada após aprovação do cliente')})}
function proxAlm(){allEst(D)?send([['V','PRODUTO DISPONÍVEL PARA RETIRADA']],ST[5],'Almoxarifado'):send([['C','PEDIDO DE COMPRA — ENVIADO PELO ALMOXARIFADO'],['V','SEU PEDIDO FOI ENVIADO PARA COMPRAS']],ST[3],'Almoxarifado')}
function reprova(){const m=prompt('Motivo da reprovação:');if(m){D.motivo=m;send([['A','CLIENTE REPROVOU']],ST[6],SET||'Solicitante')}}
function recusa(){const m=prompt('Justificativa da recusa da compra (obrigatória):');if(!m||!m.trim())return alert('A justificativa é obrigatória');D.motivo=m.trim();send([['V','COMPRA RECUSADA'],['A','COMPRA RECUSADA']],ST[7],'Compras')}
function pedido(){try{const IT=[...D.itens];document.querySelectorAll('.rc').forEach(e=>{if(!e.checked)return;const i=e.dataset.i,m=document.querySelector('.rj[data-i="'+i+'"]').value.trim();if(!m)throw new Error('Informe a justificativa de cada item recusado');IT[i]=IT[i].replace(/\s*(\[(EM ESTOQUE|RECUSADO).*|[✅❌].*)$/i,'')+' [RECUSADO: '+m+']'});
 D.itens=IT;if(!IT.filter(i=>!isRec(i)&&!isEst(i)).length){D.motivo='Todos os itens foram recusados (ver justificativas)';return send([['V','COMPRA RECUSADA'],['A','COMPRA RECUSADA']],ST[7],'Compras')}
 if(!v('p1'))throw new Error('Informe o nº do pedido');D.pedido=v('p1');D.fornecedor=v('p2');D.previsao=v('p3');const t='PEDIDO REALIZADO'+(IT.some(isRec)?' (COM ITENS RECUSADOS)':'');send([['V',t],['A',t]],ST[4],'Compras')}catch(e){alert(e.message)}}

function resolver(){const m=v('sl').trim();if(!m)return alert('Informe a solução');D.solucao=m;if(v('np').trim())D.previsao=v('np').trim();send([['A','PROBLEMA RESOLVIDO'],['V','ATUALIZAÇÃO DO SEU PEDIDO']],ST[4],'Compras','Solução: '+m)}

let INTERNO=null, THREAD=[];
function centralInterna(){pg(`${bk()}<div class="central-login"><div class="pn"><div class="ic" style="background:#2563a8;color:#fff">${ico('lock')}</div><h2>Central interna</h2><p class=mut>Acesso exclusivo aos líderes dos setores.</p><label>Setor</label><select id=isetor class=central-select>${INTERNO_SETORES.map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select><label>Senha do setor</label><input id=isenha type=password onkeydown="if(event.key=='Enter')loginInterno()" autocomplete="off"><p id=ierr class=er></p><button class="b ok" onclick=loginInterno()>ENTRAR NA CENTRAL</button><button class="b sec" onclick=diagnosticarBackend()>TESTAR CONEXÃO COM A PLANILHA</button><pre id="idiag" style="white-space:pre-wrap;font-size:12px;color:#52657a;margin-top:12px"></pre></div></div>`);$('#isenha').focus()}
async function internoPost(a,extra={}){const x=INTERNO||{};const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({a,...extra,setor:x.setor,senha:x.senha}),cache:'no-store'});const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){throw Error('O Apps Script respondeu algo que não é JSON: '+t.slice(0,180))}if(!r.ok||j.erro)throw Error(j.erro||('HTTP '+r.status));return j}
async function diagnosticarBackend(){const out=$('#idiag');if(out)out.textContent='Testando conexão...';try{const r=await fetch(API_URL+'?diagnostico='+Date.now(),{cache:'no-store'});const t=await r.text();if(out)out.textContent='Resposta do Apps Script:\n'+t}catch(e){if(out)out.textContent='Falha de conexão: '+(e.message||e)}}
async function loginInterno(){const setor=v('isetor'),senha=v('isenha');if(!senha)return $('#ierr').textContent='Informe a senha';$('#ierr').textContent='Validando...';try{const j=await (await fetch(API_URL,{method:'POST',body:JSON.stringify({a:'login',setor,senha})})).json();if(j.erro)throw Error(j.erro);INTERNO={setor,senha,nome:j.nome,perfil:j.perfil};sessionStorage.interno=JSON.stringify(INTERNO);painelInterno()}catch(e){$('#ierr').textContent=e.message||'Não foi possível entrar'}}
function painelInterno(){if(!INTERNO){try{INTERNO=JSON.parse(sessionStorage.interno||'null')}catch(e){}}if(!INTERNO)return centralInterna();pg(`${bk()}<div class="central-shell"><div class="central-banner"><h2>💬 Central interna</h2><p>${esc(INTERNO.nome)} · ${INTERNO.perfil==='ADMIN'?'Acesso total da Diretoria':'Comunicação do setor'}</p></div>${INTERNO.setor==='COMPRAS'?`<section class="painel-almox" style="background:linear-gradient(135deg,#162b52,#245a9b);margin-bottom:14px"><div class="painel-head"><div><h3>🛒 Pendências de Compras</h3><p>Pedidos enviados pelo Almoxarifado que precisam de acompanhamento.</p></div><button class="refresh" onclick="carregarPendenciaInterna()">↻ Atualizar</button></div><div id="ipend-kpis" class="kpis"><div class="kpi"><strong>—</strong><span>Na fila</span></div><div class="kpi"><strong>—</strong><span>Urgentes</span></div><div class="kpi"><strong>—</strong><span>Mais antigo</span></div></div><div id="ipend-list" class="pend-list"><div class="pend-loading">Carregando pedidos...</div></div></section>`:``}${INTERNO.perfil==='ADMIN'?`<section class="painel-almox" style="margin-bottom:14px"><div class="painel-head"><div><h3>📊 Visão gerencial</h3><p>Indicadores separados entre orçamento comercial e operação interna.</p></div><button class="refresh" onclick="carregarDashboardInterno()">↻ Atualizar</button></div><div id="idash" class="kpis"><div class="kpi"><strong>—</strong><span>Carregando</span></div></div></section>`:``}<div class="central-grid"><div><div class=pn><h3>📥 Caixa de entrada <span id=icount class=central-count>...</span></h3><small>Mensagens e protocolos que precisam da sua atenção.</small><div id=icaixa style="margin-top:12px"><div class=central-thread-empty>Carregando...</div></div></div><button class="b sec" onclick="sessionStorage.removeItem('interno');INTERNO=null;home()">Sair da central</button></div><div><div class=pn><h3>🔎 Conversa por protocolo</h3><div class=row><input id=iprot placeholder="Ex.: COM..." onkeydown="if(event.key=='Enter')carregarConversa()"><button class=b onclick=carregarConversa() style="margin:0">Abrir</button></div><div id=ithread class="central-thread" style="margin-top:12px"><div class=central-thread-empty>Digite um protocolo para abrir a conversa.</div></div><div id=icompose hidden><label>Enviar para</label><select id=idest class=central-select><option value="TODOS">Todos os envolvidos</option>${INTERNO_SETORES.map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select><textarea id=imsg rows=3 placeholder="Escreva uma mensagem interna..."></textarea><div class=central-actions><button class="b ok" onclick=enviarInterno()>Enviar mensagem</button><button class="b sec" onclick=marcarInterno()>Marcar como lida</button></div></div></div></div></div></div>`);carregarCaixa();if(INTERNO.setor==='COMPRAS')carregarPendenciaInterna();if(INTERNO.perfil==='ADMIN')carregarDashboardInterno()}
async function carregarDashboardInterno(){const box=$('#idash');if(!box)return;try{const j=await internoPost('dashboardCompleto');const c=j.comercial||{},o=j.operacional||{},f=j.financeiro||{};box.innerHTML=`<div class="kpi"><strong>${c.solicitados||0}</strong><span>Orçamentos solicitados</span></div><div class="kpi"><strong>${c.aprovados||0}</strong><span>Orçamentos aprovados</span></div><div class="kpi"><strong>${c.recusados||0}</strong><span>Orçamentos recusados</span></div><div class="kpi"><strong>${o.internas||0}</strong><span>Solicitações internas</span></div><div class="kpi"><strong>${o.disponiveis||0}</strong><span>Materiais disponíveis</span></div><div class="kpi"><strong>${o.aguardandoCompra||0}</strong><span>Aguardando compra</span></div><div class="kpi"><strong>${o.compras||0}</strong><span>Compras em andamento</span></div><div class="kpi"><strong>${o.aguardandoRecebimento||0}</strong><span>Aguardando recebimento</span></div><div class="kpi"><strong>${o.retiradas||0}</strong><span>Itens retirados</span></div><div class="kpi"><strong>R$ ${(Number(c.valorOrcado||0)).toLocaleString('pt-BR',{minimumFractionDigits:2})}</strong><span>Valor orçado</span></div><div class="kpi"><strong>R$ ${(Number(f.comprado||0)).toLocaleString('pt-BR',{minimumFractionDigits:2})}</strong><span>Valor comprado</span></div><div class="kpi"><strong>R$ ${(Number(f.pendente||0)).toLocaleString('pt-BR',{minimumFractionDigits:2})}</strong><span>Compras pendentes</span></div>`}catch(e){box.innerHTML='<div class="central-thread-empty">Não foi possível carregar os indicadores.</div>'}}
async function carregarPendenciaInterna(){const box=$('#ipend-list'),kpi=$('#ipend-kpis');if(!box)return;box.innerHTML='<div class="pend-loading">Atualizando pedidos...</div>';let lista=[];try{const j=await (await fetch(API_URL,{method:'POST',body:JSON.stringify({a:'listar'})})).json();lista=j.lista||[]}catch(e){}const permitidos=['Em compras','Pedido realizado','Problema no pedido'];const arr=lista.filter(d=>d&&d.protocolo&&permitidos.includes(d.status)).sort((a,b)=>(b.urgente-a.urgente));const urg=arr.filter(d=>d.urgente).length;if(kpi)kpi.innerHTML=`<div class="kpi"><strong>${arr.length}</strong><span>Na fila</span></div><div class="kpi"><strong>${urg}</strong><span>Urgentes</span></div><div class="kpi"><strong>${arr.length?idade_(arr[arr.length-1]):'—'}</strong><span>Mais antigo</span></div>`;box.innerHTML=arr.length?arr.map(d=>`<div class="pend-card ${d.urgente?'urgent':''}" onclick="abrirPendenciaInterna('${encodeURIComponent(d.protocolo)}')"><div class="pend-top"><span class="pend-proto">${d.urgente?'🚨 ':''}${esc(d.protocolo)}</span><span class="pend-age">${idade_(d)}</span></div><div class="pend-meta"><b>${esc(d.status)}</b> · ${esc(d.nome||'Solicitante')}</div><div class="pend-items">${esc((d.itens||[]).join(' • '))}</div></div>`).join(''):'<div class="pend-empty">✅ Nenhuma pendência de Compras.</div>'}
function abrirPendenciaInterna(p){const d=decodeURIComponent(p);$('#iprot').value=d;carregarConversa();setTimeout(()=>$('#iprot')?.scrollIntoView({behavior:'smooth',block:'center'}),100)}
async function carregarCaixa(){const el=$('#icaixa');try{const j=await internoPost('listarCaixa');$('#icount').textContent=j.naoLidas||0;const arr=j.mensagens||[];el.innerHTML=arr.length?arr.slice(0,12).map(m=>`<div class="central-msg ${m.lida==='NÃO'&&m.remetenteSetor!==INTERNO.setor?'unread':''}" onclick="abrirCaixa('${encodeURIComponent(m.protocolo)}')"><small>${esc(m.remetente)} → ${esc(m.destinatario)} · ${esc(m.protocolo)}</small><p>${esc(m.mensagem)}</p></div>`).join(''):'<div class=central-thread-empty>Nenhuma mensagem interna.</div>'}catch(e){el.innerHTML='<div class=central-thread-empty>Não foi possível carregar a caixa.</div>'}}
function abrirCaixa(p){$('#iprot').value=decodeURIComponent(p);carregarConversa()}
async function carregarConversa(){const p=v('iprot').trim().toUpperCase();if(!p)return alert('Digite o protocolo');const box=$('#ithread');box.innerHTML='<div class=central-thread-empty>Carregando conversa...</div>';try{const j=await internoPost('listarMensagens',{protocolo:p});THREAD=j.mensagens||[];box.innerHTML=THREAD.length?THREAD.map(m=>`<div class="central-msg ${m.remetenteSetor===INTERNO.setor?'':'unread'}"><small>${esc(m.remetente)} (${esc(m.remetenteSetor)}) → ${esc(m.destinatario)} · ${new Date(m.data).toLocaleString('pt-BR')}</small><p>${esc(m.mensagem)}</p></div>`).join(''):'<div class=central-thread-empty>Não há mensagens nesta conversa.</div>';$('#icompose').hidden=false;marcarInterno()}catch(e){box.innerHTML='<div class=central-thread-empty>'+esc(e.message)+'</div>'}}
async function enviarInterno(){const p=v('iprot').trim().toUpperCase(),msg=v('imsg').trim(),dest=v('idest');if(!p||!msg)return alert('Informe o protocolo e a mensagem');try{const j=await internoPost('enviarMensagem',{protocolo:p,mensagem:msg,destinatario:dest});if(j.erro)throw Error(j.erro);$('#imsg').value='';await carregarConversa();carregarCaixa()}catch(e){alert(e.message||'Erro ao enviar')}}
async function marcarInterno(){const p=v('iprot').trim().toUpperCase();if(p)try{await internoPost('marcarLidas',{protocolo:p});carregarCaixa()}catch(e){}}
home();
</script></body></html>
